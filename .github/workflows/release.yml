name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Install npm dependencies
        run: npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js
        run: npx next build
        env:
          DATABASE_URL: "file:./dev.db"
          NODE_ENV: production

      - name: Prepare server bundle
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force .next/static .next/standalone/.next/
          Copy-Item -Recurse -Force public .next/standalone/
          New-Item -ItemType Directory -Force -Path src-tauri/server
          Copy-Item -Recurse -Force .next/standalone/* src-tauri/server/

      - name: Download Node.js runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v22.16.0/node-v22.16.0-win-x64.zip" -OutFile "node-runtime.zip"
          Expand-Archive -Path "node-runtime.zip" -DestinationPath "src-tauri/node-runtime-temp"
          Move-Item -Path "src-tauri/node-runtime-temp/node-v22.16.0-win-x64" -Destination "src-tauri/node-runtime"
          Remove-Item -Recurse -Force "src-tauri/node-runtime-temp"
          Remove-Item "node-runtime.zip"

      - name: Build Tauri app
        run: cargo tauri build
        env:
          DATABASE_URL: "file:./data.db"
          NODE_ENV: production

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
