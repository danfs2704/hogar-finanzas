<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cargando Hogar Finanzas...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #ecfdf5 0%, #ffffff 50%, #f0fdfa 100%);
      color: #0f766e;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 18px;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #d1fae5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.18);
    }
    .spinner {
      width: 38px;
      height: 38px;
      border: 4px solid rgba(16, 185, 129, 0.18);
      border-top-color: #10b981;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      color: #134e4a;
      margin: 0;
    }
    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin: 0;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">💰</div>
    <div class="spinner"></div>
    <p class="title">Hogar Finanzas</p>
    <p class="subtitle">Iniciando aplicación…</p>
  </div>
</body>
</html>
